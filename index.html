      function parseCSV(text){
        const rows=[];
        
        // Dividir por líneas
        const lines = text.replace(/\r/g,'').split('\n');
        if(lines.length < 2) return rows;
        
        // Primera línea es el header
        const headerLine = lines[0];
        
        // Parser robusto para CSV con comillas
        function parseCSVLine(line) {
          const values = [];
          let current = '';
          let inQuotes = false;
          
          for(let i = 0; i < line.length; i++) {
            const char = line[i];
            const nextChar = line[i + 1];
            
            if(char === '"') {
              if(inQuotes && nextChar === '"') {
                current += '"';
                i++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if(char === ',' && !inQuotes) {
              values.push(current);
              current = '';
            } else {
              current += char;
            }
          }
          values.push(current);
          return values;
        }
        
        // Contar campos esperados
        const headerValues = parseCSVLine(headerLine);
        const expectedFields = headerValues.length;
        
        const headers = []; 
        headerValues.forEach(h => {
          let clean = h.trim();
          clean = clean.replace(/^"|"$/g, '').trim();
          clean = clean.toLowerCase();
          headers.push(clean);
        });
        
        console.log('Headers:', headers);
        console.log('Campos esperados:', expectedFields);
        
        // Función para detectar si una línea es continuación de un registro
        // Una línea es CONTINUACIÓN si:
        // 1. Comienza con espacios
        // 2. Es una URL
        // 3. Es completamente vacía
        // 4. Contiene patrones de datos secundarios (destinos, productos conocidos)
        // 5. Tiene formato de email o número sin comas
        function isContinuationLine(line) {
          if(!line || !line.trim()) return true;
          if(/^\s/.test(line)) return true;
          if(/^https?:\/\//.test(line.trim())) return true;
          if(/@/.test(line)) return true; // email
          
          // Patrones comunes de continuación
          const continuationKeywords = [
            'METIONINA', 'GRANIZO', 'MAIZ', 'SORGO', 'FINCA', 'CARGO', 'LINEAS',
            'CARNE', 'POLLO', 'HUESO', 'ALIMENTO', 'PRODUCTO', 'BUEN', 'BIEN',
            'BOGOTA', 'MEDELLIN', 'CALI', 'BARRANQUILLA', 'CARTAGENA',
            'AVENIDA', 'CARRERA', 'CALLE', 'DIRECCION', 'VIA',
            'A:', 'PARA:', 'EN:', 'DE:', 'DEL:', 'DESDE:', 'HACIA:'
          ];
          
          const trimmed = line.trim().toUpperCase();
          for(let kw of continuationKeywords) {
            if(trimmed.startsWith(kw)) return true;
          }
          
          // Si no tiene commas, probablemente es continuación
          let commaCount = 0;
          let inQuotes = false;
          for(let i = 0; i < line.length; i++) {
            const char = line[i];
            const nextChar = line[i + 1];
            if(char === '"') {
              if(inQuotes && nextChar === '"') {
                i++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if(char === ',' && !inQuotes) {
              commaCount++;
            }
          }
          
          // Si tiene menos de 2 comas, probablemente es continuación
          return commaCount < 2;
        }
        
        // Procesar líneas agrupando inteligentemente
        let i = 1;
        let registrosValidos = 0;
        
        while(i < lines.length) {
          // Buscar inicio de registro válido (línea que NO es continuación)
          if(isContinuationLine(lines[i])) {
            i++;
            continue;
          }
          
          let line = lines[i];
          let values = parseCSVLine(line);
          
          // Si no tiene suficientes campos, agrupar con líneas de continuación
          while(values.length < expectedFields && i + 1 < lines.length) {
            const nextLine = lines[i + 1];
            
            // Si la siguiente línea NO es continuación, parar
            if(!isContinuationLine(nextLine)) {
              break;
            }
            
            i++;
            if(nextLine && nextLine.trim()) {
              line += '\n' + nextLine;
              values = parseCSVLine(line);
            }
          }
          
          // Limpiar y normalizar valores
          for(let j = 0; j < values.length; j++) {
            let val = values[j].trim();
            val = val.replace(/^"|"$/g, '').trim();
            values[j] = val;
          }
          
          // Asegurar cantidad correcta de campos
          while(values.length < expectedFields) {
            values.push('');
          }
          values = values.slice(0, expectedFields);
          
          // Crear objeto
          const obj = {};
          for(let j = 0; j < headers.length; j++) {
            obj[headers[j]] = values[j] || '';
          }
          
          // SIEMPRE agregar el registro, aunque esté incompleto
          // El renderTabla se encargará de recuperar los campos
          const firstField = headers[0];
          if(obj[firstField] && obj[firstField].trim()) {
            rows.push(obj);
            registrosValidos++;
          }
          
          i++;
        }
        
        console.log(`✓ REGISTROS PARSEADOS: ${registrosValidos}`);
        return rows;
      }
      function obtenerFechaISO(valor){
  if(!valor) return null;

  // quitar hora
  valor = valor.trim().split(' ')[0];

  // DD/MM/YYYY
  if(valor.includes('/')){
    const [d,m,y] = valor.split('/');
    return new Date(y, m-1, d);
  }

  // YYYY-MM-DD
  if(valor.match(/^\d{4}-\d{2}-\d{2}$/)){
    const [y,m,d] = valor.split('-');
    return new Date(y, m-1, d);
  }

  return null;
}


function renderTabla(datos){
  tablaBody.innerHTML = '';

  if(!datos.length){
    tablaBody.innerHTML =
      '<tr><td colspan="10" class="empty">No hay datos</td></tr>';
    filtradosEl.textContent = '0';
    return;
  }

  // Invertir orden (más reciente primero)
  const datosInvertidos = Array.from(datos).reverse();

  datosInvertidos.forEach((r, displayIndex) => {
    const tr = document.createElement('tr');
    const originalIndex = datos.length - 1 - displayIndex;
    const numeroFila = datos.length - displayIndex;
    tr.setAttribute('data-index', originalIndex);
    
    // Obtener valores con búsqueda flexible de keys
    function getField(fieldName) {
      // Buscar coincidencia directa
      if(r[fieldName]) return (r[fieldName] || '').trim();
      
      // Buscar coincidencia case-insensitive
      const lower = fieldName.toLowerCase();
      for(let key in r) {
        if(key.toLowerCase() === lower) {
          return (r[key] || '').trim();
        }
      }
      
      // Buscar coincidencia parcial
      for(let key in r) {
        if(key.toLowerCase().includes(lower)) {
          return (r[key] || '').trim();
        }
      }
      
      return '';
    }
    
    let transportadora = getField('transportadora');
    let conductor = getField('conductor');
    let cedula = getField('cedula') || getField('cédula');
    let placa = getField('placa');
    let destino = getField('destino');
    let producto = getField('producto');
    let fecha = getField('fecha');
    let evidencia = getField('evidencia');
    
    // LÓGICA DE RECUPERACIÓN: Si los datos están en el primer campo separados por saltos de línea
    if(!conductor && !cedula && !placa && transportadora.includes('\n')) {
      const partes = transportadora.split('\n').filter(p => p.trim());
      if(partes.length > 1) {
        transportadora = partes[0].trim();
        
        // Procesar líneas restantes para extraer campos
        for(let i = 1; i < partes.length; i++) {
          const part = partes[i].trim();
          
          // Skip URLs y continuaciones conocidas
          if(/^https?:\/\//.test(part) || /^METIONINA|^GRANIZO|^MAIZ|^SORGO|^FINCA|^CARGO/i.test(part)) {
            continue;
          }
          
          // Detectar cédula (dígitos solos)
          if(!cedula && /^\d{6,15}$/.test(part.replace(/[-.\s]/g, ''))) {
            cedula = part;
          }
          // Detectar placa (3 letras + 3 números)
          else if(!placa && /^[A-Z]{2,3}\d{3,4}$/.test(part.replace(/[-\s]/g, ''))) {
            placa = part;
          }
          // Detectar conductor (nombres largos, palabras con espacios)
          else if(!conductor && part.length > 5 && /^[A-ZÁÉÍÓÚa-záéíóú\s]+$/.test(part)) {
            conductor = part;
          }
          // Detectar destino (ciudades, ubicaciones)
          else if(!destino && part.length > 3 && !part.match(/^\d/)) {
            destino = part;
          }
          // Detectar producto si aún está vacío
          else if(!producto && part.length > 2) {
            producto = part;
          }
        }
      }
    }
    
    // Si aún faltan campos, intentar recuperar desde los datos concatenados
    if(!conductor && transportadora.includes(' ') && !transportadora.match(/^[A-Z]{2,}/)) {
      // Si transportadora parece un nombre de persona, es probablemente el conductor
      if(/[a-zA-ZÁÉÍÓÚáéíóú]{4,}/.test(transportadora)) {
        conductor = transportadora;
        transportadora = '';
      }
    }
    
    // Validar si la cédula está donde debería ser la transportadora
    if(!cedula && /^\d{4,}/.test(transportadora)) {
      cedula = transportadora.split(' ')[0];
      transportadora = transportadora.substring(cedula.length).trim();
    }
    
    // Convertir a mayúsculas
    transportadora = transportadora.toUpperCase().trim();
    conductor = conductor.toUpperCase().trim();
    cedula = cedula.toUpperCase().trim();
    placa = placa.toUpperCase().trim();
    destino = destino.toUpperCase().trim();
    producto = producto.toUpperCase().trim();
    fecha = fecha.toUpperCase().trim();
    
    // Crear botón para evidencia
    let btnEvidencia = '';
    if(evidencia && (evidencia.includes('google.com') || evidencia.includes('drive.google.com') || evidencia.includes('http'))) {
      btnEvidencia = `<button class="btn-ver-evidencia" data-url="${evidencia}" style="background:#4CAF50;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">👁️ Ver</button>`;
    } else {
      btnEvidencia = '<span style="color:#999;font-size:12px;">Sin archivo</span>';
    }

    let btnEliminar = `<button class="btn-eliminar-registro" data-index="${originalIndex}" style="background:#d32f2f;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">🗑️ Eliminar</button>`;

    tr.innerHTML = `
      <td>${numeroFila}</td>
      <td>${transportadora || '⚠️'}</td>
      <td>${conductor || '⚠️'}</td>
      <td>${cedula || '⚠️'}</td>
      <td>${placa || '⚠️'}</td>
      <td>${destino || '⚠️'}</td>
      <td>${producto || '⚠️'}</td>
      <td>${fecha || '⚠️'}</td>
      <td>${btnEvidencia}</td>
      <td>${btnEliminar}</td>
    `;

    tablaBody.appendChild(tr);
  });

  // Agregar listeners
  document.querySelectorAll('.btn-ver-evidencia').forEach(btn => {
    btn.addEventListener('click', function() {
      abrirEvidencia(this.getAttribute('data-url'));
    });
  });

  document.querySelectorAll('.btn-eliminar-registro').forEach(btn => {
    btn.addEventListener('click', function() {
      const index = parseInt(this.getAttribute('data-index'));
      if(confirm('¿Estás seguro de que deseas eliminar este registro?')) {
        eliminarRegistro(index);
      }
    });
  });

  filtradosEl.textContent = datos.length;
  registrosEl.textContent = datosOriginales.length;
}

      function aplicarFiltros(){
  const t = fTransport.value.trim().toLowerCase();
  const p = fPlaca.value.trim().toLowerCase();
  const c = fConductor.value.trim().toLowerCase();
  const f = fproducto.value.trim().toLowerCase();
  const fecha = fFecha.value;

  const filtrados = datosOriginales.filter(r=>{
    // Normalizar valores y comparar
    const transportadora = (r.transportadora || r['Transportadora'] || '').toLowerCase();
    const placa = (r.placa || r['Placa'] || '').toLowerCase();
    const conductor = (r.conductor || r['Conductor'] || '').toLowerCase();
    
    // Buscar producto
    let producto = '';
    for(let key in r) {
      if(key.toLowerCase().includes('producto')) {
        producto = (r[key] || '').toLowerCase();
        break;
      }
    }
    
    // Buscar fecha en todas las variantes
    let fechaRegistro = '';
    for(let key in r) {
      if(key.toLowerCase().includes('fecha')) {
        fechaRegistro = (r[key] || '');
        break;
      }
    }

    if(t && !transportadora.includes(t)) return false;
    if(p && !placa.includes(p)) return false;
    if(c && !conductor.includes(c)) return false;
    if(f && !producto.includes(f)) return false;
    
    if(fecha){
      const fechaObj = obtenerFechaISO(fechaRegistro);
      const [y, m, d] = fecha.split('-');
      const fechaFiltro = new Date(y, m - 1, d);

      if(!fechaObj) return false;

      if(
        fechaObj.getFullYear() !== fechaFiltro.getFullYear() ||
        fechaObj.getMonth() !== fechaFiltro.getMonth() ||
        fechaObj.getDate() !== fechaFiltro.getDate()
      ){
        return false;
      }
    }

    return true;
  });

  renderTabla(filtrados);
}

    

      function descargarXLS(){ 
        if(!datosOriginales.length){ 
          alert('No hay datos para exportar'); 
          return; 
        } 
        
        const headers=['Transportadora','Conductor','Cédula','Placa','Destino','Producto','Fecha','Evidencia']; 
        const rows=[headers.join('\t')]; 
        
        datosOriginales.forEach(r=>{ 
          let transportadora = (r.transportadora || r['Transportadora'] || '').trim().toUpperCase(); 
          let conductor = (r.conductor || r['Conductor'] || '').trim().toUpperCase(); 
          let cedula = (r.cedula || r['Cédula'] || r['cédula'] || '').trim().toUpperCase(); 
          let placa = (r.placa || r['Placa'] || '').trim().toUpperCase(); 
          let destino = (r.destino || r['Destino'] || '').trim().toUpperCase(); 
          
          // Buscar producto con variantes correctas
          let producto = '';
          for(let key in r) {
            if(key.toLowerCase().includes('producto')) {
              producto = (r[key] || '').trim().toUpperCase();
              break;
            }
          }
          
          // Buscar fecha con variantes correctas
          let fecha = '';
          for(let key in r) {
            if(key.toLowerCase().includes('fecha')) {
              fecha = (r[key] || '').trim().toUpperCase();
              break;
            }
          }
          
          // Buscar evidencia con variantes correctas
          let evidencia = '';
          for(let key in r) {
            if(key.toLowerCase().includes('evidencia')) {
              evidencia = (r[key] || '').trim();
              break;
            }
          }
          
          rows.push([transportadora,conductor,cedula,placa,destino,producto,fecha,evidencia].join('\t')); 
        }); 
        
        const blob=new Blob([rows.join('\n')],{type:'application/vnd.ms-excel'}); 
        const a=document.createElement('a'); 
        a.href=URL.createObjectURL(blob); 
        a.download=`despachos_${new Date().toISOString().slice(0,10)}.xls`; 
        a.click(); 
        URL.revokeObjectURL(a.href); 
      }

      const PROXY_TEMPLATES = [
        'https://api.allorigins.win/raw?url={url}',
        'https://thingproxy.freeboard.io/fetch/{url}',
        'https://api.codetabs.com/v1/proxy?quest={url}'
      ];
      let lastCSVText = '';
      const forceProxyEl = document.getElementById('forceProxy');

      // Restore user preference
      try{ const pref = localStorage.getItem('useProxy'); if(pref==='1') forceProxyEl.checked = true; }catch(e){}

      forceProxyEl.addEventListener('change', ()=>{ try{ localStorage.setItem('useProxy', forceProxyEl.checked ? '1' : '0'); }catch(e){} });

      function buildProxyUrls(){
        return PROXY_TEMPLATES.map(t => t.replace('{url}', encodeURIComponent(URL_CSV)) + '&t=' + Date.now());
      }

 function appendRows(rows){
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    
    // Obtener valores con búsqueda flexible de keys
    function getField(fieldName) {
      // Buscar coincidencia directa
      if(r[fieldName]) return (r[fieldName] || '').trim();
      
      // Buscar coincidencia case-insensitive
      const lower = fieldName.toLowerCase();
      for(let key in r) {
        if(key.toLowerCase() === lower) {
          return (r[key] || '').trim();
        }
      }
      
      // Buscar coincidencia parcial
      for(let key in r) {
        if(key.toLowerCase().includes(lower)) {
          return (r[key] || '').trim();
        }
      }
      
      return '';
    }
    
    let transportadora = getField('transportadora');
    let conductor = getField('conductor');
    let cedula = getField('cedula') || getField('cédula');
    let placa = getField('placa');
    let destino = getField('destino');
    let producto = getField('producto');
    let fecha = getField('fecha');
    let evidencia = getField('evidencia');
    
    // LÓGICA DE RECUPERACIÓN: Si los datos están en el primer campo separados por saltos de línea
    if(!conductor && !cedula && !placa && transportadora.includes('\n')) {
      const partes = transportadora.split('\n').filter(p => p.trim());
      if(partes.length > 1) {
        transportadora = partes[0].trim();
        
        // Procesar líneas restantes para extraer campos
        for(let i = 1; i < partes.length; i++) {
          const part = partes[i].trim();
          
          // Skip URLs y continuaciones conocidas
          if(/^https?:\/\//.test(part) || /^METIONINA|^GRANIZO|^MAIZ|^SORGO|^FINCA|^CARGO/i.test(part)) {
            continue;
          }
          
          // Detectar cédula (dígitos solos)
          if(!cedula && /^\d{6,15}$/.test(part.replace(/[-.\s]/g, ''))) {
            cedula = part;
          }
          // Detectar placa (3 letras + 3 números)
          else if(!placa && /^[A-Z]{2,3}\d{3,4}$/.test(part.replace(/[-\s]/g, ''))) {
            placa = part;
          }
          // Detectar conductor (nombres largos, palabras con espacios)
          else if(!conductor && part.length > 5 && /^[A-ZÁÉÍÓÚa-záéíóú\s]+$/.test(part)) {
            conductor = part;
          }
          // Detectar destino (ciudades, ubicaciones)
          else if(!destino && part.length > 3 && !part.match(/^\d/)) {
            destino = part;
          }
          // Detectar producto si aún está vacío
          else if(!producto && part.length > 2) {
            producto = part;
          }
        }
      }
    }
    
    // Si aún faltan campos, intentar recuperar desde los datos concatenados
    if(!conductor && transportadora.includes(' ') && !transportadora.match(/^[A-Z]{2,}/)) {
      // Si transportadora parece un nombre de persona, es probablemente el conductor
      if(/[a-zA-ZÁÉÍÓÚáéíóú]{4,}/.test(transportadora)) {
        conductor = transportadora;
        transportadora = '';
      }
    }
    
    // Validar si la cédula está donde debería ser la transportadora
    if(!cedula && /^\d{4,}/.test(transportadora)) {
      cedula = transportadora.split(' ')[0];
      transportadora = transportadora.substring(cedula.length).trim();
    }
    
    // Convertir a mayúsculas
    transportadora = transportadora.toUpperCase().trim();
    conductor = conductor.toUpperCase().trim();
    cedula = cedula.toUpperCase().trim();
    placa = placa.toUpperCase().trim();
    destino = destino.toUpperCase().trim();
    producto = producto.toUpperCase().trim();
    fecha = fecha.toUpperCase().trim();

    // Crear botón para evidencia
    let btnEvidencia = '';
    if(evidencia && (evidencia.includes('google.com') || evidencia.includes('drive.google.com') || evidencia.includes('http'))) {
      btnEvidencia = `<button class="btn-ver-evidencia" data-url="${evidencia}" style="background:#4CAF50;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">👁️ Ver</button>`;
    } else {
      btnEvidencia = '<span style="color:#999;font-size:12px;">Sin archivo</span>';
    }

    // Botón para eliminar
    let btnEliminar = `<button class="btn-eliminar-registro" data-index="${datosOriginales.length - 1}" style="background:#d32f2f;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">🗑️ Eliminar</button>`;

    tr.innerHTML = `
      <td>${datosOriginales.length}</td>
      <td>${transportadora}</td>
      <td>${conductor}</td>
      <td>${cedula}</td>
      <td>${placa}</td>
      <td>${destino}</td>
      <td>${producto}</td>
      <td>${fecha}</td>
      <td>${btnEvidencia}</td>
      <td>${btnEliminar}</td>
    `;

    tr.classList.add('new-row');
    tablaBody.appendChild(tr);

    setTimeout(() => tr.classList.add('highlight'), 50);
    setTimeout(() => tr.classList.remove('highlight'), 3500);
  });

  // Agregar listeners a botones de evidencia
  document.querySelectorAll('.btn-ver-evidencia').forEach(btn => {
    btn.addEventListener('click', function() {
      abrirEvidencia(this.getAttribute('data-url'));
    });
  });

  // Agregar listeners a botones de eliminar
  document.querySelectorAll('.btn-eliminar-registro').forEach(btn => {
    btn.addEventListener('click', function() {
      const index = parseInt(this.getAttribute('data-index'));
      if(confirm('¿Estás seguro de que deseas eliminar este registro?')) {
        eliminarRegistro(index);
      }
    });
  });

  registrosEl.textContent = datosOriginales.length;
  filtradosEl.textContent = datosOriginales.length;
}

function generarIDRegistro(r){
  return `${r.fecha}|${r.placa}|${r.transportadora}`.toLowerCase();
}

function solicitarPermisoNotificaciones(){
  if (!("Notification" in window)) return;

  if (Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function notificarNuevoRegistro(registro){
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;

  new Notification("📦 Nuevo despacho registrado", {
    body:
      `🚛 ${registro.transportadora || ''}\n` +
      `⛔ Placa: ${registro.placa || ''}\n` +
      `📦 Producto: ${registro.producto || ''}`,
    icon: "https://cdn-icons-png.flaticon.com/512/1995/1995574.png"
  });
}

      async function cargarDatos(){
        estadoEl.textContent = 'Actualizando…';
        errorMsg.style.display = 'none';

        const useProxy = forceProxyEl.checked;

        async function tryFetch(url){
          const t0 = performance.now();
          const res = await fetch(url, { cache: 'no-store' });
          const t1 = performance.now();
          const took = Math.round(t1 - t0);
          if(!res.ok) throw new Error('HTTP ' + res.status + ' (took ' + took + 'ms)');
          const text = await res.text();
          return { text, took };
        }

        // Build attempt list (direct + multiple proxies)
        const attempts = [];
        if(!useProxy){ attempts.push(URL_CSV + '&t=' + Date.now()); }
        attempts.push(...buildProxyUrls());

        let finalText = null; let lastErr = null; let tookMs = null; let tried = [];
        for(const url of attempts){
          tried.push(url);
          try{
            const { text, took } = await tryFetch(url);
            finalText = text;
            tookMs = took;
            break;
          }catch(e){ lastErr = e; console.warn('fetch attempt failed', e); }
        }

        if(finalText === null){
          estadoEl.textContent = '⚠ Error';
          errorMsg.innerHTML = 'Error: ' + (lastErr && lastErr.message ? lastErr.message : lastErr) + ' — Comprueba que la hoja esté publicada.' +
            '<br><small>Intentos: ' + tried.map(u=>u.split('?')[0]).join(', ') + '</small>';
          errorMsg.style.display = 'block';
          return;
        }

        // If data unchanged, just update timestamp and status
        if(lastCSVText === finalText){
          ultimaEl.textContent = new Date().toLocaleTimeString();
          estadoEl.textContent = '✓ OK';
          return;
        }

        // New or first-time data
        if(!lastCSVText){
          // full parse and render
          datosOriginales = parseCSV(finalText);
          console.log('Campos recibidos:', Object.keys(datosOriginales[0] || {}));
          console.log('Total campos:', Object.keys(datosOriginales[0] || {}).length);
          console.log('Total registros:', datosOriginales.length);
          
          // Buscar y mostrar registro 359 específicamente
          if(datosOriginales.length >= 359) {
            console.log('\n=== REGISTRO 359 COMPLETO (INCOMPLETO) ===');
            const reg359 = datosOriginales[358]; // índice 358 = registro 359
            console.log('Todas las claves y valores:');
            for(let key in reg359) {
              console.log(`  "${key}": "${reg359[key]}"`);
            }
          }
          
          console.log('\n=== PRIMEROS 5 REGISTROS ===');
          for(let i = 0; i < Math.min(5, datosOriginales.length); i++) {
            const r = datosOriginales[i];
            console.log(`\nRegistro ${i+1}:`);
            for(let key in r) {
              console.log(`  "${key}": "${r[key]}"`);
            }
          }
           datosOriginales.forEach(r => {
    const id = generarIDRegistro(r);
    registrosNotificados.add(id); // marcar como ya vistos
  });
          renderTabla(datosOriginales);
        } else {
          // incremental: compute new lines and append
          const newLines = finalText.trim().split('\n');
          const oldLines = lastCSVText.trim().split('\n');
          if(newLines.length > oldLines.length){
            const headers = newLines[0];
            const added = newLines.slice(oldLines.length).join('\n');
            const partialCSV = headers + '\n' + added;
            const nuevas = parseCSV(partialCSV);
            // append to datosOriginales and table
nuevas.forEach(r => {
  const id = generarIDRegistro(r);

  if (!registrosNotificados.has(id)) {
    registrosNotificados.add(id);
    notificarNuevoRegistro(r); // 🔔 solo una vez
  }

  datosOriginales.push(r);
});

appendRows(nuevas);


          } else {
            // different but same number of lines (edited rows) — re-render full
            datosOriginales = parseCSV(finalText);
            renderTabla(datosOriginales);
          }
        }

        lastCSVText = finalText;
        ultimaEl.textContent = new Date().toLocaleTimeString();
        estadoEl.textContent = '✓ OK';
      }

      btnFiltrar.addEventListener('click',aplicarFiltros);
btnLimpiar.addEventListener('click',()=>{
  fTransport.value='';
  fPlaca.value='';
  fConductor.value='';
  fproducto.value='';
  fFecha.value='';
  renderTabla(datosOriginales);
});
     
      btnXLS.addEventListener('click',descargarXLS);
      btnActualizar.addEventListener('click',cargarDatos);

      // Función para eliminar registros
      function eliminarRegistro(index) {
        if(index >= 0 && index < datosOriginales.length) {
          datosOriginales.splice(index, 1);
          renderTabla(datosOriginales);
        }
      }

      // Función para abrir evidencia en nueva pestaña
      function abrirEvidencia(url) {
        if(!url || !url.trim()) {
          alert('No hay archivo disponible');
          return;
        }

        url = url.trim();

        // Detectar tipo de archivo
        const esGoogleDrive = url.includes('drive.google.com') || url.includes('docs.google.com/open');

        // Si es Google Drive, extraer ID y generar URL de preview
        let urlFinal = url;
        if(esGoogleDrive && url.includes('id=')) {
          const id = url.split('id=')[1].split('&')[0];
          urlFinal = `https://drive.google.com/file/d/${id}/preview`;
        }

        // Abrir en nueva pestaña
        window.open(urlFinal, '_blank', 'noopener,noreferrer');
      }

      solicitarPermisoNotificaciones();
      cargarDatos();
      setInterval(cargarDatos, 5000);

    </script>
